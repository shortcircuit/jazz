<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utah Jazz Live Scoreboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 4vw;
            overflow: hidden;
        }
        header {
            text-align: center;
            font-size: 2.2vh;
            letter-spacing: 0.2vw;
            text-transform: uppercase;
            color: #002B5C; /* Jazz Navy Accent */
            font-weight: 700;
        }
        .scoreboard-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 90vw;
            flex-grow: 1;
        }
        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 35%;
        }
        .team-logo {
            width: 12vw;
            height: 12vw;
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
            margin-bottom: 1.5vh;
        }
        .team-name {
            font-size: 3vh;
            font-weight: 600;
            margin-bottom: 1vh;
        }
        .score {
            font-size: 14vh;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .game-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 20%;
            text-align: center;
        }
        .status {
            font-size: 2.8vh;
            font-weight: 700;
            color: #F9A01B; /* Jazz Yellow Accent */
            margin-bottom: 1vh;
            text-transform: uppercase;
        }
        .clock {
            font-size: 3.5vh;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #e0e0e0;
        }
        .possession {
            font-size: 2vh;
            color: #002B5C;
            font-weight: bold;
            margin-top: 1vh;
            height: 3vh;
        }
        footer {
            text-align: center;
            font-size: 1.6vh;
            color: #666666;
            letter-spacing: 0.1vw;
        }
    </style>
</head>
<body>

    <header>Utah Jazz Live Telemetry Hub</header>

    <div class="scoreboard-container">
        <!-- Home / Away Team 1 -->
        <div class="team-box" id="team1-box">
            <img id="team1-logo" class="team-logo" src="" alt="Team Logo">
            <div id="team1-name" class="team-name">Loading...</div>
            <div id="team1-score" class="score">0</div>
        </div>

        <!-- Central Game Status -->
        <div class="game-info">
            <div id="game-status" class="status">Connecting</div>
            <div id="game-clock" class="clock">--:--</div>
            <div id="possession-indicator" class="possession"></div>
        </div>

        <!-- Team 2 -->
        <div class="team-box" id="team2-box">
            <img id="team2-logo" class="team-logo" src="" alt="Team Logo">
            <div id="team2-name" class="team-name">Loading...</div>
            <div id="team2-score" class="score">0</div>
        </div>
    </div>

    <footer id="last-updated">Auto-Sync Active (ESPN API)</footer>

    <script>
        let lastAnnouncedScore = "";
        let lastQuarter = "";

        async function fetchLiveScores() {
            try {
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard');
                const data = await response.json();
                
                // Locate Utah Jazz game
                let jazzGame = null;
                for (let event of data.events) {
                    for (let competitor of event.competitions[0].competitors) {
                        if (competitor.team.abbreviation === 'UTA') {
                            jazzGame = event.competitions[0];
                            break;
                        }
                    }
                    if (jazzGame) break;
                }

                if (!jazzGame && data.events.length > 0) {
                    jazzGame = data.events[0].competitions[0]; // Fallback to featured game if Jazz aren't playing today
                }

                if (jazzGame) {
                    const comp1 = jazzGame.competitors[0];
                    const comp2 = jazzGame.competitors[1];

                    // Update UI elements
                    document.getElementById('team1-logo').src = comp1.team.logo;
                    document.getElementById('team1-name').textContent = comp1.team.displayName;
                    document.getElementById('team1-score').textContent = comp1.score;

                    document.getElementById('team2-logo').src = comp2.team.logo;
                    document.getElementById('team2-name').textContent = comp2.team.displayName;
                    document.getElementById('team2-score').textContent = comp2.score;

                    const statusType = jazzGame.status.type.state;
                    const statusDetail = jazzGame.status.type.detail;
                    document.getElementById('game-status').textContent = statusType === 'pre' ? 'Upcoming' : statusDetail;
                    document.getElementById('game-clock').textContent = jazzGame.status.displayClock || "";

                    // Possession check if available in NBA API payload
                    let possessionText = "";
                    if (comp1.possession) possessionText = `${comp1.team.shortDisplayName} has the ball.`;
                    if (comp2.possession) possessionText = `${comp2.team.shortDisplayName} has the ball.`;
                    document.getElementById('possession-indicator').textContent = possessionText;

                    // Text-to-Speech Announcement on Score/Quarter change
                    const currentScoreState = `${comp1.team.shortDisplayName} ${comp1.score}, ${comp2.team.shortDisplayName} ${comp2.score}. ${possessionText}`;
                    if (statusType === 'in' && currentScoreState !== lastAnnouncedScore) {
                        lastAnnouncedScore = currentScoreState;
                        speakAnnouncement(currentScoreState);
                    }

                    document.getElementById('last-updated').textContent = `Last Synced: ${new Date().toLocaleTimeString()}`;
                } else {
                    document.getElementById('game-status').textContent = "No Live Games";
                }
            } catch (error) {
                console.error("API Sync Error:", error);
                document.getElementById('game-status').textContent = "Sync Retrying";
            }
        }

        function speakAnnouncement(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }

        fetchLiveScores();
        setInterval(fetchLiveScores, 10000);
    </script>
</body>
</html>
